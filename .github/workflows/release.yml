# Publishes to npm when a version tag (v1.2.3) is pushed, with npm Trusted Publishing (OIDC): no npm token is stored.
# Configure once on npmjs.com → package settings → Trusted publishing → GitHub Actions:
#   organization uarch-solutions · repository cdk-github-runner-switch · workflow release.yml · environment npm
name: Release
on:
  push: { tags: ['v*'] }

permissions:
  contents: write # GitHub release
  id-token: write # OIDC token for npm (trusted publishing + provenance)

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, registry-url: 'https://registry.npmjs.org' }
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm publish --access public
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env: { GH_TOKEN: '${{ github.token }}' }
